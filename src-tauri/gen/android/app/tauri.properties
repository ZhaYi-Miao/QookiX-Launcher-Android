# Android 包的 versionName / versionCode。
#
# 这个文件本来是 tauri CLI 生成并维护的，但本仓库的构建（本地脚本与 CI）都只跑
# gradle，不会重新生成它 —— 不填的话 `app/build.gradle.kts` 里会退回默认值
# `versionName = 1.0` / `versionCode = 1`，系统「应用信息」里看到的版本号就永远是 1.0。
#
# 维护约定：发版时和 package.json / Cargo.toml / tauri.conf.json 一起改。
# versionCode 用 `major*10000 + minor*100 + patch`（1.2.3 → 10203），必须**只增不减**
# —— 安卓拒绝安装 versionCode 更低的包（用户是从应用内更新安装 APK 的）。
tauri.android.versionName=1.2.3
tauri.android.versionCode=10203
