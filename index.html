<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <!--
      禁掉双指捏合缩放。
      启动器界面是按「可用高度精确排版」的（标题栏 + 内容 + 底部导航，列表内部自己滚），
      一旦允许缩放就会被放大到超出屏幕、按钮点不到。
      注意：这跟 debug / 正式版**无关** —— HTML 是同一份，
      不写 user-scalable=no 的话两种包都能双指缩放。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <title>QookiX Launcher</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
